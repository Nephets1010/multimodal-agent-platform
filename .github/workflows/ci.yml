name: ci

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      # 唯一安装步骤：只装 requirements.txt 的核心依赖，不装可选依赖。
      - name: Install core dependencies only
        run: python3 -m pip install -r requirements.txt

      # 五步验证 1/5：标准库编译校验，不引入任何表外 lint 工具。
      - name: Compile check (stdlib only)
        run: python3 -m compileall -q app scripts tests

      # 五步验证 2/5：全局 DEMO_MODE=1，零 API Key、零联网、零模型权重下载。
      - name: Pytest
        run: DEMO_MODE=1 python3 -m pytest -q tests

      # 五步验证 3/5：不启动真实端口，TestClient 冒烟全部 7 组端点与 /health。
      - name: Demo smoke
        run: DEMO_MODE=1 python3 scripts/demo.py

      # 五步验证 4/5：自带 8 条样例评测，退出码 0 且 6 字段齐备。
      - name: Evaluator
        run: DEMO_MODE=1 python3 -m app.observability.evaluator

      # 五步验证 5/5：内联契约冒烟（不新增文件、不新增依赖）。
      - name: Contract smoke
        run: |
          python3 -c "
          from fastapi.testclient import TestClient
          from app.main import app
          from app.schemas import UnifiedResponse
          import json
          c = TestClient(app)
          h = c.get('/health')
          assert h.status_code == 200
          b = h.json()
          assert b['demo_mode'] is True
          assert len(b['components']) == 11
          assert b['version'] == '1.0.0'
          assert 'configured_backends' not in b
          r = c.post('/v1/chat', json={'query': '计算 12*8 的结果', 'stream': False})
          assert r.status_code == 200
          assert len(r.json()) == 11 and '96' in r.json()['answer']
          assert len(UnifiedResponse.model_fields) == 11
          s = c.post('/v1/chat', json={'query': '介绍一下平台', 'stream': True}).text
          frames = [f for f in s.split('\n\n') if f.strip()]
          names = [l.split(':', 1)[1].strip() for f in frames for l in f.splitlines() if l.startswith('event:')]
          assert names[0] == 'meta' and names[-1] == 'done'
          done = json.loads([l.split(':', 1)[1].strip() for l in frames[-1].splitlines() if l.startswith('data:')][0])
          assert set(done) == set(r.json())
          print('contract smoke OK')
          "
